[workspace]
members = [
    "crates/sim-core",
    "crates/sim-core/resource-macro",
    "crates/sim-help",
    "crates/pdp-8",
    "crates/nullsystem",
]

resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["B. Scott Michel <scooter.phd@gmail.com>"]
license = "MIT"
repository = "fixme."
description = "A Rust-based rewrite of the SIMH computer simulation framework."

[workspace.dependencies]
anyhow = "1.0.102"
thiserror = "2.0.18"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
toml = { version = "1.1.2+spec-1.1.0", features = ["serde"] }
bitflags = "2.11.1"